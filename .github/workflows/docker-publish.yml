name: Publish Docker images

# Builds both images and pushes them to the GitHub Container Registry:
#   ghcr.io/<owner>/listening-dungeon            (the game)
#   ghcr.io/<owner>/listening-dungeon-abs-stats  (the Audiobookshelf stats service)
# Every push to main updates :latest; a tag like v1.1 also publishes :1.1.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: listening-dungeon
            context: .
          - image: listening-dungeon-abs-stats
            context: ./abs-stats
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3      # also build for ARM (Raspberry Pi, Apple Silicon)
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=v(.*),group=1

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
