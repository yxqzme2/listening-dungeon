<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monster Bestiary · The Listening Dungeon</title>
<link rel="stylesheet" href="/static/game/paper.css?v=2">
<style>
  /* Monster Bestiary: every monster a player has met; the rest are silhouettes. */
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px 60px; }
  .progress { max-width: 460px; margin: 0 auto 26px; text-align: center; color: var(--muted); }
  .bar { height: 22px; background: #5E574C; border: 2px solid var(--ink); position: relative; margin-top: 6px; }
  .bar i { position: absolute; inset: 0 auto 0 0; background: var(--mustard); }
  .bar b { position: relative; display: block; line-height: 18px; font-family: var(--marker); font-weight: 400; font-size: 14px; color: #FBF8F0; text-shadow: 0 1px 0 rgba(0,0,0,.6); }
  .tier h2 { font-size: 24px; margin: 26px 0 4px; display: flex; align-items: baseline; gap: 10px; }
  .tier h2 small { font-family: var(--hand); font-size: 16px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; margin-top: 10px; }
  .card { background: var(--card); padding: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
  .card:nth-child(odd) { transform: rotate(-.5deg); } .card:nth-child(even) { transform: rotate(.5deg); }
  .art { height: 180px; display: grid; place-items: end center; }
  .art svg { max-height: 180px; width: auto; filter: drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(3px 5px 3px rgba(0,0,0,.25)); }
  .art svg:not([height]) { height: 150px; }
  .card.hidden .art svg { filter: brightness(0) opacity(.55); }
  .card.hidden { background: #E6DDC8; }
  .name { font-family: var(--marker); font-size: 18px; line-height: 1.1; }
  .role { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--red); }
  .meta { font-size: 15px; color: var(--muted); line-height: 1.2; }
  .lore { font-size: 14px; color: var(--ink); font-style: italic; line-height: 1.2; margin-top: 4px; }
  .locked { color: var(--muted); font-size: 15px; }
  .note { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
<nav class="nav-bar"></nav>
<script src="/static/game/paper-nav.js?v=1"></script>
<div class="wrap">
  <div class="paper-head"><h1>Monster Bestiary</h1><p>Every monster you've faced in a dungeon. The rest are still out there.</p></div>
  <div id="out"><p class="note">Opening the Bestiary…</p></div>
</div>
<script src="/static/js/monster-art.js?v=launch1"></script>
<script src="/static/game/dungeon.js?v=launch11"></script>
<script>
(function () {
  const esc = (x) => String(x ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const art = (e) => e.art ? MonsterArt.render(e.art, { height: e.role === "boss" ? 175 : e.role === "elite" ? 160 : 140 }) : Dungeon.legacyArt(e.svg);
  const ROLE = { regular: "Monster", elite: "Elite", boss: "Floor boss" };
  const when = (t) => new Date(t * 1000).toLocaleDateString();
  const card = (e) => e.seen
    ? `<div class="card"><div class="art">${art(e)}</div><span class="role">${ROLE[e.role]}</span><span class="name">${esc(e.name)}</span>
        <span class="meta">${e.defeated ? `Defeated ${e.defeated}×` : "Met, not yet defeated"} · first met ${when(e.first_seen)}</span>
        ${e.defeated ? `<span class="meta">${esc(e.style)} · ${e.moves.length} moves</span>${e.appear ? `<span class="lore">“${esc(e.appear)}”</span>` : ""}` : `<span class="locked">Beat it once to learn more.</span>`}</div>`
    : `<div class="card hidden"><div class="art">${art(e)}</div><span class="role">${ROLE[e.role]}</span><span class="name">???</span><span class="locked">Not yet encountered</span></div>`;
  fetch("/api/game/bestiary", { credentials: "same-origin" }).then(async (r) => {
    if (r.status === 401) { document.getElementById("out").innerHTML = `<p class="note">Log in to see your Bestiary. <a href="/">Go to the game</a></p>`; return; }
    const d = await r.json();
    const pct = d.total ? Math.round((100 * d.found) / d.total) : 0;
    // General monsters by tier, then one section per book series.
    const tiers = [...new Set(d.entries.filter((e) => !e.series).map((e) => e.tier))].sort((a, b) => a - b);
    const series = [...new Set(d.entries.filter((e) => e.series).map((e) => e.series))].sort();
    const section = (title, list) => {
      const found = list.filter((e) => e.seen).length;
      return `<section class="tier"><h2>${title(found)} <small>${found} / ${list.length}</small></h2><div class="grid">${list.map(card).join("")}</div></section>`;
    };
    document.getElementById("out").innerHTML = `
      <div class="progress">${d.found ? "Keep crawling to fill it in." : "Empty for now. Enter a dungeon and meet something unpleasant."}
        <div class="bar"><i style="width:${pct}%"></i><b>${d.found} / ${d.total} discovered</b></div></div>
      ${tiers.map((t) => section((found) => found ? esc(d.tiers[t] || "") : "???", d.entries.filter((e) => !e.series && e.tier === t))).join("")}
      ${series.map((sr) => section(() => esc(sr), d.entries.filter((e) => e.series === sr))).join("")}`;
  }).catch(() => { document.getElementById("out").innerHTML = `<p class="note">Couldn't open the Bestiary. Try again.</p>`; });
})();
</script>
</body>
</html>
